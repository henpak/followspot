name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Followspot version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.3"
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Mac
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Number of displays, screen sharing app (Zoom, Teams, Meet, …), anything else that might matter.
  - type: textarea
    id: log
    attributes:
      label: Event log (optional)
      description: See "Troubleshooting" in the README for how to record it.
      render: text
