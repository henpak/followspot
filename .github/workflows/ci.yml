name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package app (universal)
        run: scripts/package-app.sh --universal --zip

      - name: Inspect bundle
        run: |
          lipo -archs build/Followspot.app/Contents/MacOS/Followspot
          codesign -dv build/Followspot.app
          plutil -p build/Followspot.app/Contents/Info.plist

      - uses: actions/upload-artifact@v4
        with:
          name: Followspot-${{ github.sha }}
          path: |
            build/Followspot.zip
            build/Followspot.zip.sha256
          retention-days: 14

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint scripts
        run: shellcheck scripts/*.sh
